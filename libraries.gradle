ext {
    groovy_version = '5.0.6'
    geb_version = '8.0.1'
    selenium_version = '4.44.0'
    cucumber_version = '7.34.3'
    junit_version = '6.1.0'
}

ext.lib = [
        groovy                         : "org.apache.groovy:groovy:${groovy_version}",
        geb                            : "org.apache.groovy.geb:geb-core:${geb_version}",
        selenium_java                  : "org.seleniumhq.selenium:selenium-java:${selenium_version}",
        cucumber_java                  : "io.cucumber:cucumber-java:${cucumber_version}",
        cucumber_junit_platform_engine : "io.cucumber:cucumber-junit-platform-engine:${cucumber_version}",
        junit_bom                      : "org.junit:junit-bom:${junit_version}",
        junit_jupiter                  : 'org.junit.jupiter:junit-jupiter',
        junit_platform_suite           : 'org.junit.platform:junit-platform-suite'
]
